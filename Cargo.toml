[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/arena",
    "crates/time",
    "crates/space",
    "crates/physics",
    "crates/render",
    "crates/storage",
    "bin/codeworld",
    # attack覆写机制技术spike验证程序（非生产代码，验证三条候选路径）
    "spike/route_a",
    "spike/route_b",
    "spike/route_c",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["土豆"]

[workspace.dependencies]
# WASM运行时
wasmtime = "25"
# WAT文本 -> WASM字节码（spike验证用，手写wat模块）
wat = "1"

# 异步运行时
tokio = { version = "1", features = ["full"] }

# 存储
rusqlite = { version = "0.31", features = ["bundled"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 日志
tracing = "0.1"
tracing-subscriber = "0.3"

# 错误处理
anyhow = "1"
thiserror = "1"

# UUID
uuid = { version = "1", features = ["v4"] }

# PNG 解码（D-017 收图通道：纯 Rust 单库，image 全家桶太重）
png = "0.17"

# SHA-256 指纹（#051 资产镜像仓：同图全局一份——内容寻址去重判据，MC 同款）
sha2 = "0.10"

# 终端操控（操控层 v0：raw mode 裸键输入 + alternate screen，roguelike 事实标准）
crossterm = "0.28"
