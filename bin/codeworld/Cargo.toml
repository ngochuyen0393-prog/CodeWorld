[package]
name = "codeworld"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# 7 个 crate 串成 tick 循环（架构文档 4.1 节）
codeworld-core = { path = "../../crates/core" }
codeworld-time = { path = "../../crates/time" }
codeworld-space = { path = "../../crates/space" }
codeworld-physics = { path = "../../crates/physics" }
codeworld-arena = { path = "../../crates/arena" }
codeworld-render = { path = "../../crates/render" }
codeworld-storage = { path = "../../crates/storage" }
# WAT 文本 -> WASM 字节码（测试实体沙箱用，spike 验证模式）
wat = { workspace = true }
# 错误处理
anyhow = { workspace = true }
# 日志
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# 终端操控（操控层 v0：raw mode + 事件轮询 + alternate screen）
crossterm = { workspace = true }
# 快照序列化（期四第一刀：WS 快照 JSON）
serde = { workspace = true }
serde_json = { workspace = true }
# 异步运行时（WS 服务器独立线程 + broadcast 快照通道桥接，期四第一刀）
tokio = { workspace = true }
# Web 服务（WS + 静态验收页一把抓：路由/ServeDir/WS升级同框架，第二刀 HTML 同入口伺服）
axum = { version = "0.7", features = ["ws", "multipart"] }
tower-http = { version = "0.5", features = ["fs"] }
# WS 连接 split/流操作（axum 依赖树内已有，零新增编译）
futures-util = "0.3"
# 资产 ID 生成（D-017 头像资产 av_ + UUID 前 16 hex）
uuid = { workspace = true }
# SHA-256 指纹（#051 资产镜像仓：同图全局一份——内容寻址去重判据）
sha2 = { workspace = true }

[dev-dependencies]
# 测试构造固定 EntityId
uuid = { workspace = true }
# 测试自产 PNG fixtures（D-017 上传通道集成测试）
png = { workspace = true }
# WS 集成测试客户端（0.21 与 axum 0.7 内部 ws 栈同版本，不重复编译）
tokio-tungstenite = "0.21"
# 测试客户端 split/next 流操作
futures-util = "0.3"
